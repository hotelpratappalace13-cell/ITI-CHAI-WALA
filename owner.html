<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ITI Chai Wala | Owner Dashboard</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f1ed;
    color:#292929;
}

header{
    background:#5b2c06;
    color:white;
    padding:18px;
    text-align:center;
}

header h1{
    font-size:25px;
}

header p{
    margin-top:5px;
    font-size:13px;
}

.container{
    width:95%;
    max-width:1200px;
    margin:20px auto;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:20px;
}

.card{
    background:white;
    border-radius:12px;
    padding:18px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.card h3{
    font-size:14px;
    color:#777;
}

.card strong{
    display:block;
    font-size:25px;
    margin-top:8px;
    color:#5b2c06;
}

.section{
    background:white;
    padding:18px;
    border-radius:12px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.section h2{
    color:#5b2c06;
    margin-bottom:15px;
    font-size:20px;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:700px;
}

th,td{
    padding:11px 8px;
    border-bottom:1px solid #eee;
    text-align:left;
    font-size:14px;
}

th{
    background:#f5eee7;
    color:#5b2c06;
}

button{
    border:0;
    padding:8px 12px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.status-btn{
    background:#5b2c06;
    color:white;
}

.delete-btn{
    background:#d32f2f;
    color:white;
}

.refresh-btn{
    background:#5b2c06;
    color:white;
    margin-bottom:15px;
}

.status{
    padding:5px 9px;
    border-radius:15px;
    font-size:12px;
    font-weight:bold;
    display:inline-block;
}

.new{
    background:#fff3cd;
    color:#856404;
}

.preparing{
    background:#d1ecf1;
    color:#0c5460;
}

.complete{
    background:#d4edda;
    color:#155724;
}

.delivered{
    background:#e2e3e5;
    color:#383d41;
}

.empty{
    text-align:center;
    padding:25px;
    color:#777;
}

.menu-row{
    display:flex;
    gap:10px;
    margin-bottom:10px;
    flex-wrap:wrap;
}

.menu-row input{
    padding:10px;
    border:1px solid #ccc;
    border-radius:7px;
}

.menu-name{
    flex:1;
    min-width:150px;
}

.menu-price{
    width:100px;
}

.add-btn{
    background:#198754;
    color:white;
}

.save-btn{
    background:#5b2c06;
    color:white;
}

.remove-btn{
    background:#d32f2f;
    color:white;
}

.settings-box{
    display:grid;
    gap:12px;
}

.settings-box input{
    padding:11px;
    border:1px solid #ccc;
    border-radius:7px;
}

@media(max-width:800px){
    .stats{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:500px){
    .stats{
        grid-template-columns:1fr 1fr;
    }

    .card{
        padding:13px;
    }

    .card strong{
        font-size:21px;
    }

    header h1{
        font-size:21px;
    }
}
</style>
</head>

<body>

<header>
    <h1>☕ ITI CHAI WALA</h1>
    <p>Owner Dashboard</p>
</header>

<div class="container">

    <div class="stats">

        <div class="card">
            <h3>Total Orders</h3>
            <strong id="totalOrders">0</strong>
        </div>

        <div class="card">
            <h3>Total Sales</h3>
            <strong id="totalSales">₹0</strong>
        </div>

        <div class="card">
            <h3>Items Sold</h3>
            <strong id="itemsSold">0</strong>
        </div>

        <div class="card">
            <h3>New Orders</h3>
            <strong id="newOrders">0</strong>
        </div>

        <div class="card">
            <h3>Preparing</h3>
            <strong id="preparingOrders">0</strong>
        </div>

        <div class="card">
            <h3>Complete</h3>
            <strong id="completeOrders">0</strong>
        </div>

        <div class="card">
            <h3>Delivered</h3>
            <strong id="deliveredOrders">0</strong>
        </div>

        <div class="card">
            <h3>Today's Sales</h3>
            <strong id="todaySales">₹0</strong>
        </div>

    </div>


    <div class="section">

        <h2>📦 Orders</h2>

        <button class="refresh-btn" onclick="loadOrders()">
            🔄 Refresh Orders
        </button>

        <div class="table-wrap">

            <table>

                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Table</th>
                        <th>Item</th>
                        <th>Qty</th>
                        <th>Total</th>
                        <th>Time</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="ordersBody">

                    <tr>
                        <td colspan="8" class="empty">
                            Orders loading...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>


    <div class="section">

        <h2>🍽️ Manage Menu</h2>

        <div id="menuRows"></div>

        <button class="add-btn" onclick="addMenuRow()">
            + Add Item
        </button>

        <button class="save-btn" onclick="saveMenu()">
            💾 Save Menu
        </button>

    </div>


    <div class="section">

        <h2>⚙️ Settings</h2>

        <div class="settings-box">

            <input
                type="text"
                id="shopName"
                placeholder="Shop Name"
            >

            <input
                type="text"
                id="shopAddress"
                placeholder="Shop Address"
            >

            <button class="save-btn" onclick="saveSettings()">
                💾 Save Settings
            </button>

        </div>

    </div>

</div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbx7PWk-_E0MU2bn5VsLMVHGMGbZFVjRaSYCXJXn50ay2_kodfrKc43EddUNc7EujMJb8g/exec";


let allOrders = [];


/* =========================
   LOAD ORDERS
========================= */

async function loadOrders(){

    const body = document.getElementById("ordersBody");

    body.innerHTML =
    `<tr>
        <td colspan="8" class="empty">
            Orders loading...
        </td>
    </tr>`;

    try{

        const response = await fetch(API_URL);

        const data = await response.json();

        if(!Array.isArray(data)){

            body.innerHTML =
            `<tr>
                <td colspan="8" class="empty">
                    No order data found
                </td>
            </tr>`;

            return;
        }

        allOrders = [];

        for(let i=1;i<data.length;i++){

            const row = data[i];

            if(!row || row.length < 8) continue;

            allOrders.push({

                time: row[0],

                table: row[1],

                item: row[2],

                quantity: Number(row[3]) || 0,

                price: Number(row[4]) || 0,

                total: Number(row[5]) || 0,

                status: String(row[6] || "New"),

                orderId: String(row[7] || "")

            });

        }

        updateStats();

        displayOrders();

    }
    catch(error){

        console.error(error);

        body.innerHTML =
        `<tr>
            <td colspan="8" class="empty">
                ❌ Orders load nahi ho rahe
            </td>
        </tr>`;

    }

}


/* =========================
   DISPLAY ORDERS
========================= */

function displayOrders(){

    const body =
    document.getElementById("ordersBody");

    body.innerHTML = "";

    const activeOrders =
    allOrders.filter(order =>
        order.status.toLowerCase() !== "delivered"
    );

    if(activeOrders.length === 0){

        body.innerHTML =
        `<tr>
            <td colspan="8" class="empty">
                📭 Koi active order nahi hai
            </td>
        </tr>`;

        return;
    }

    activeOrders.reverse().forEach(order => {

        const tr =
        document.createElement("tr");

        tr.innerHTML = `

            <td>
                <b>${escapeHTML(order.orderId)}</b>
            </td>

            <td>
                Table ${escapeHTML(order.table)}
            </td>

            <td>
                ${escapeHTML(order.item)}
            </td>

            <td>
                ${order.quantity}
            </td>

            <td>
                ₹${order.total}
            </td>

            <td>
                ${escapeHTML(order.time)}
            </td>

            <td>
                ${statusHTML(order.status)}
            </td>

            <td>

                <button
                    class="status-btn"
                    onclick="changeStatus('${encodeURIComponent(order.orderId)}')">
                    Change
                </button>

                <button
                    class="delete-btn"
                    onclick="deleteOrder('${encodeURIComponent(order.orderId)}')">
                    Delete
                </button>

            </td>

        `;

        body.appendChild(tr);

    });

}


/* =========================
   STATUS HTML
========================= */

function statusHTML(status){

    const s =
    String(status).toLowerCase();

    let cls = "new";

    if(s === "preparing"){
        cls = "preparing";
    }

    if(s === "complete"){
        cls = "complete";
    }

    if(s === "delivered"){
        cls = "delivered";
    }

    return `
        <span class="status ${cls}">
            ${escapeHTML(status)}
        </span>
    `;
}


/* =========================
   CHANGE STATUS
========================= */

async function changeStatus(encodedId){

    const orderId =
    decodeURIComponent(encodedId);

    const newStatus =
    prompt(
        "Status likho:\n\nNew\nPreparing\nComplete\nDelivered"
    );

    if(!newStatus) return;

    const valid = [
        "New",
        "Preparing",
        "Complete",
        "Delivered"
    ];

    const matched =
    valid.find(
        x => x.toLowerCase() === newStatus.toLowerCase()
    );

    if(!matched){

        alert(
            "Sirf New, Preparing, Complete ya Delivered likho."
        );

        return;
    }

    try{

        await fetch(API_URL,{

            method:"POST",

            body:JSON.stringify({

                action:"updateStatus",

                orderId:orderId,

                status:matched

            })

        });

        alert("Status update ho gaya ✅");

        loadOrders();

    }
    catch(error){

        alert("Status update nahi hua.");

        console.error(error);

    }

}


/* =========================
   DELETE ORDER
========================= */

async function deleteOrder(encodedId){

    const orderId =
    decodeURIComponent(encodedId);

    const confirmDelete =
    confirm(
        "Kya aap is order ko delete karna chahte ho?"
    );

    if(!confirmDelete) return;

    try{

        await fetch(API_URL,{

            method:"POST",

            body:JSON.stringify({

                action:"deleteOrder",

                orderId:orderId

            })

        });

        alert("Order delete ho gaya ✅");

        loadOrders();

    }
    catch(error){

        alert("Order delete nahi hua.");

        console.error(error);

    }

}


/* =========================
   STATS
========================= */

function updateStats(){

    let totalSales = 0;

    let itemsSold = 0;

    let newCount = 0;

    let preparingCount = 0;

    let completeCount = 0;

    let deliveredCount = 0;

    const orderIds = new Set();

    let todaySales = 0;


    allOrders.forEach(order => {

        totalSales += order.total;

        itemsSold += order.quantity;

        if(order.orderId){
            orderIds.add(order.orderId);
        }

        const status =
        order.status.toLowerCase();

        if(status === "new"){
            newCount++;
        }

        if(status === "preparing"){
            preparingCount++;
        }

        if(status === "complete"){
            completeCount++;
        }

        if(status === "delivered"){
            deliveredCount++;
        }

        const date =
        parseDate(order.time);

        if(date){

            const now = new Date();

            if(
                date.getDate() === now.getDate() &&
                date.getMonth() === now.getMonth() &&
                date.getFullYear() === now.getFullYear()
            ){

                todaySales += order.total;

            }

        }

    });


    document.getElementById("totalOrders")
        .textContent = orderIds.size;

    document.getElementById("totalSales")
        .textContent = "₹" + totalSales;

    document.getElementById("itemsSold")
        .textContent = itemsSold;

    document.getElementById("newOrders")
        .textContent = newCount;

    document.getElementById("preparingOrders")
        .textContent = preparingCount;

    document.getElementById("completeOrders")
        .textContent = completeCount;

    document.getElementById("deliveredOrders")
        .textContent = deliveredCount;

    document.getElementById("todaySales")
        .textContent = "₹" + todaySales;

}


/* =========================
   DATE PARSER
========================= */

function parseDate(value){

    if(!value) return null;

    const str =
    String(value).trim();

    const match =
    str.match(
        /^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2}):(\d{2})$/
    );

    if(match){

        return new Date(

            Number(match[3]),

            Number(match[2]) - 1,

            Number(match[1]),

            Number(match[4]),

            Number(match[5]),

            Number(match[6])

        );

    }

    const d =
    new Date(str);

    if(!isNaN(d.getTime())){
        return d;
    }

    return null;

}


/* =========================
   MENU
========================= */

async function loadMenu(){

    try{

        const response =
        await fetch(API_URL + "?action=menu");

        const data =
        await response.json();

        const rows =
        document.getElementById("menuRows");

        rows.innerHTML = "";

        if(Array.isArray(data) && data.length > 1){

            for(let i=1;i<data.length;i++){

                if(!data[i]) continue;

                addMenuRow(
                    data[i][0] || "",
                    data[i][1] || ""
                );

            }

        }

        if(rows.children.length === 0){

            addMenuRow("Chai","20");
            addMenuRow("Water Bottle","10");

        }

    }
    catch(error){

        console.log("Menu load error",error);

        if(
            document.getElementById("menuRows")
            .children.length === 0
        ){

            addMenuRow("Chai","20");

        }

    }

}


function addMenuRow(name="",price=""){

    const container =
    document.getElementById("menuRows");

    const row =
    document.createElement("div");

    row.className =
    "menu-row";

    row.innerHTML = `

        <input
            class="menu-name"
            type="text"
            placeholder="Item name"
            value="${escapeAttribute(name)}"
        >

        <input
            class="menu-price"
            type="number"
            placeholder="Price"
            value="${escapeAttribute(price)}"
        >

        <button
            class="remove-btn"
            onclick="this.parentElement.remove()">
            Remove
        </button>

    `;

    container.appendChild(row);

}


async function saveMenu(){

    const rows =
    [
        ...document.querySelectorAll("#menuRows .menu-row")
    ];

    const menu = [];

    rows.forEach(row => {

        const name =
        row.querySelector(".menu-name").value.trim();

        const price =
        row.querySelector(".menu-price").value.trim();

        if(name && price){

            menu.push({

                name:name,

                price:Number(price)

            });

        }

    });

    if(menu.length === 0){

        alert("Menu me kam se kam ek item rakho.");

        return;

    }

    try{

        const response =
        await fetch(API_URL,{

            method:"POST",

            body:JSON.stringify({

                action:"saveMenu",

                menu:menu

            })

        });

        const result =
        await response.json();

        if(result.success){

            alert("Menu save ho gaya ✅");

        }
        else{

            alert(
                "Menu save nahi hua."
            );

        }

    }
    catch(error){

        console.error(error);

        alert(
            "Menu save karte waqt error aaya."
        );

    }

}


/* =========================
   SETTINGS
========================= */

async function loadSettings(){

    try{

        const response =
        await fetch(API_URL + "?action=settings");

        const data =
        await response.json();

        if(
            Array.isArray(data) &&
            data.length > 1
        ){

            const settings = {};

            for(let i=1;i<data.length;i++){

                if(data[i][0]){

                    settings[
                        String(data[i][0])
                    ] = data[i][1];

                }

            }

            if(settings.shopName){

                document.getElementById("shopName")
                    .value = settings.shopName;

            }

            if(settings.shopAddress){

                document.getElementById("shopAddress")
                    .value = settings.shopAddress;

            }

        }

    }
    catch(error){

        console.log(
            "Settings load error",
            error
        );

    }

}


async function saveSettings(){

    const shopName =
    document.getElementById("shopName")
    .value.trim();

    const shopAddress =
    document.getElementById("shopAddress")
    .value.trim();

    try{

        const response =
        await fetch(API_URL,{

            method:"POST",

            body:JSON.stringify({

                action:"saveSettings",

                settings:{

                    shopName:shopName,

                    shopAddress:shopAddress

                }

            })

        });

        const result =
        await response.json();

        if(result.success){

            alert(
                "Settings save ho gayi ✅"
            );

        }
        else{

            alert(
                "Settings save nahi hui."
            );

        }

    }
    catch(error){

        console.error(error);

        alert(
            "Settings save karte waqt error aaya."
        );

    }

}


/* =========================
   SECURITY HELPERS
========================= */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

    return escapeHTML(value);

}


/* =========================
   START
========================= */

loadOrders();

loadMenu();

loadSettings();


/* AUTO REFRESH EVERY 10 SEC */

setInterval(
    loadOrders,
    10000
);

</script>

</body>
                </html>
